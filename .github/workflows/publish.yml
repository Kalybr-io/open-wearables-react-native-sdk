name: Publish

# Publishes @kalybr-io/open-wearables to the Kalybr-io GitHub Packages npm
# registry when a version tag (v*) is pushed. The Expo module is built via the
# package's own `prepare` / `prepublishOnly` hooks (expo-module-scripts), so the
# published tarball ships a fresh `build/` alongside the native ios/android/src
# sources and app.plugin.js declared in package.json "files". It also bundles the
# native Android SDK into android/maven (see the steps below).
#
# Release flow: bump "version" in package.json, commit, then
#   git tag v0.1.0 && git push origin v0.1.0
# Or run it manually from the Actions tab (workflow_dispatch) to publish the
# current package.json version from the selected branch. Either way, npm publish
# fails if that version already exists in the registry — bump the version first.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kalybr-io'

      - name: Install dependencies
        run: npm ci

      # The native Android SDK isn't on Maven Central, so it's built from upstream's source at the
      # version android/build.gradle depends on and bundled into android/maven (with the Samsung
      # Health SDK it brings). Gradle in the app finds it there through the config plugin.
      - name: Read the native Android SDK version
        id: native
        run: echo "version=$(grep -oP 'com\.openwearables\.health:sdk:\K[0-9.]+' android/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Checkout the native Android SDK
        uses: actions/checkout@v4
        with:
          repository: the-momentum/open_wearables_android_sdk
          ref: v${{ steps.native.outputs.version }}
          path: native-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build the native Android SDK into Maven Local
        working-directory: native-android
        # Upstream commits gradlew without the executable bit, so it runs through bash.
        run: bash ./gradlew :sdk:publishReleasePublicationToMavenLocal -PlocalPublishVersion=${{ steps.native.outputs.version }}

      - name: Bundle it into android/maven
        run: |
          mkdir -p android/maven/com/samsung/android
          cp -R ~/.m2/repository/com/openwearables android/maven/com/
          cp -R ~/.m2/repository/com/samsung/android/health android/maven/com/samsung/android/
          test -f "android/maven/com/openwearables/health/sdk/${{ steps.native.outputs.version }}/sdk-${{ steps.native.outputs.version }}.aar"
          find android/maven -type f

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
